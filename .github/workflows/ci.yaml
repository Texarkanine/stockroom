name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/sr-search
    steps:
      - uses: actions/checkout@v7

      - name: Install Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Hermetic, torch-free sync from the committed lock. --no-config keeps
      # ambient user config from leaking into resolution.
      - name: Sync locked environment
        run: uv sync --frozen --no-config

      - name: Lock is not stale
        run: uv lock --locked --no-config

      - name: Lint
        run: uv run --no-sync --no-config ruff check

      - name: Format check
        run: uv run --no-sync --no-config ruff format --check

      # Coverage-enabled suite (same Make targets as local). Replaces bare
      # pytest / node --test so CI does not run each root twice.
      - name: Coverage engine
        working-directory: ${{ github.workspace }}
        run: make coverage-engine

      - name: Coverage dashboard JavaScript
        working-directory: ${{ github.workspace }}
        run: make coverage-dashboard-js

      - name: Upload engine coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: skills/sr-search/coverage/lcov.info
          flags: engine
          fail_ci_if_error: false

      - name: Upload dashboard-js coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: skills/sr-search/coverage-js/lcov.info
          flags: dashboard-js
          fail_ci_if_error: false

      # REUSE compliance for the whole tree (REUSE.toml lives at the repo root).
      - name: REUSE lint
        working-directory: ${{ github.workspace }}
        run: uv run --project skills/sr-search --no-sync --no-config reuse lint
