name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited # when title is edited - necessary for checking convcommits in title
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-title:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore

