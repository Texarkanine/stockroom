# Enforce conventional-commit PR titles (squash-merge uses the title as the changelog entry).
# feat/fix cut a release; chore must not. docs is disallowed (does not release / republish Pages).
name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-title:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            perf
            test
            build
            ci
            revert
