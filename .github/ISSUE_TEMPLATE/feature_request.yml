name: Feature request
description: Propose a change — say what you can't do today and what you want instead.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Short and concrete wins. Design docs and freeform ideas can still use a [blank issue](https://github.com/Texarkanine/stockroom/issues/new).
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of stockroom this touches.
      options:
        - Install / setup
        - Hooks / harness
        - Shim / PATH
        - Ingest / schedule
        - Search (SQL)
        - Semantic / torch
        - Dashboard
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you can't do today (or what's painful).
      placeholder: I want to … but today …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you want instead. Sketch is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other approaches you tried or ruled out.
    validations:
      required: false
